<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Isle — Build Your World</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap');

  :root {
    --ice: #e8f4fd;
    --ice2: #cce8f8;
    --snow: #f0f8ff;
    --ocean: #2196b8;
    --ocean2: #1565a8;
    --teal: #00b8a9;
    --teal2: #008f83;
    --gold: #ffd166;
    --gold2: #f4a621;
    --coral: #ff7f7f;
    --coral2: #e05050;
    --mint: #c8f5e0;
    --purple: #a78bfa;
    --night: #0d1b2a;
    --night2: #162940;
    --text: #1a2e40;
    --text2: #4a6080;
    --white: #ffffff;
    --card: #ffffffdd;
    --border: #b8d9f0;
    --shadow: 0 4px 24px rgba(33,110,180,0.13);
    --r: 18px;
    --r2: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #0d2b4a 0%, #1a4870 40%, #1565a8 100%);
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── STARS BACKGROUND ── */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; opacity: 0; }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:.8} }

  /* ── LAYOUT ── */
  #app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* ── TOP BAR ── */
  #topbar {
    background: rgba(13,27,42,0.75);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: 10px 20px;
    display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 100;
  }
  #topbar .logo { font-family: 'Fredoka One'; font-size: 22px; color: var(--gold); letter-spacing: 1px; }
  .stat-pill {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 4px 14px;
    font-size: 13px; font-weight: 700; color: white;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-pill span { font-size: 16px; }
  #topbar .spacer { flex: 1; }
  #nav-tabs { display: flex; gap: 4px; }
  .tab-btn {
    background: transparent; border: none; cursor: pointer;
    color: rgba(255,255,255,0.55); font-family: 'Nunito'; font-weight: 700; font-size: 13px;
    padding: 7px 14px; border-radius: 10px; transition: all .2s;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.1); color: white; }
  .tab-btn.active { background: var(--teal); color: white; }

  /* ── VIEWS ── */
  .view { display: none; flex: 1; padding: 20px; }
  .view.active { display: block; }

  /* ── WORLD GRID ── */
  #world-container {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--r); padding: 16px;
    overflow: auto;
  }
  #world-grid {
    display: grid;
    grid-template-columns: repeat(20, 52px);
    grid-template-rows: repeat(16, 52px);
    gap: 2px;
  }
  .cell {
    width: 52px; height: 52px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 26px;
    transition: background .15s, transform .1s;
    position: relative;
  }
  .cell:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
  .cell.locked {
    background: rgba(0,0,0,0.3);
    cursor: not-allowed;
    filter: brightness(0.4);
  }
  .cell.locked:hover { transform: none; background: rgba(0,0,0,0.3); }
  .cell.selected-tool { outline: 3px solid var(--gold); outline-offset: -2px; }

  /* ── TOOLBAR ── */
  #toolbar {
    background: rgba(13,27,42,0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--r); padding: 12px 16px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .tool-section { display: flex; gap: 6px; align-items: center; }
  .tool-sep { width: 1px; height: 36px; background: rgba(255,255,255,0.15); }
  .tool-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: .5px; }
  .tool-btn {
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 6px 10px; cursor: pointer;
    font-size: 22px; transition: all .15s; display: flex; align-items: center; gap: 5px;
  }
  .tool-btn span { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); }
  .tool-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
  .tool-btn.active { background: var(--teal); border-color: var(--teal2); }
  .tool-btn.erase-btn { border-color: rgba(255,100,100,0.3); }
  .tool-btn.erase-btn.active { background: var(--coral2); border-color: var(--coral); }

  /* ── STORY PANEL ── */
  #story-view { max-width: 820px; margin: 0 auto; }
  .story-chapter {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--r); padding: 22px 26px; margin-bottom: 16px;
  }
  .story-chapter.locked { opacity: .5; filter: grayscale(.6); }
  .chapter-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .chapter-icon { font-size: 36px; }
  .chapter-title { font-family: 'Fredoka One'; font-size: 20px; color: var(--gold); }
  .chapter-sub { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .chapter-body { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.65; margin-bottom: 14px; }
  .chapter-tasks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .task-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,0.2); border-radius: 10px; padding: 8px 14px;
    font-size: 13px; color: rgba(255,255,255,0.8);
  }
  .task-row.done { color: var(--teal); }
  .task-row .check { font-size: 18px; }
  .task-progress { flex: 1; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .task-progress-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width .4s; }
  .claim-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border: none; border-radius: 12px; padding: 10px 22px;
    font-family: 'Nunito'; font-weight: 800; font-size: 14px; color: var(--night);
    cursor: pointer; transition: all .2s;
  }
  .claim-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,209,102,0.35); }
  .claim-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .claimed-badge {
    background: var(--teal); color: white; border-radius: 12px;
    padding: 10px 22px; font-weight: 800; font-size: 14px;
  }

  /* ── MINIGAME VIEW ── */
  #minigame-view { max-width: 820px; margin: 0 auto; }
  .minigame-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .minigame-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--r); padding: 22px;
    cursor: pointer; transition: all .2s; text-align: center;
  }
  .minigame-card:hover { background: rgba(255,255,255,0.12); transform: translateY(-4px); box-shadow: var(--shadow); }
  .minigame-card .mg-icon { font-size: 48px; margin-bottom: 10px; }
  .minigame-card .mg-name { font-family: 'Fredoka One'; font-size: 18px; color: var(--gold); margin-bottom: 6px; }
  .minigame-card .mg-desc { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }
  .mg-reward { display: inline-block; background: rgba(255,209,102,0.15); border: 1px solid var(--gold); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--gold); margin-top: 10px; }

  /* ── MODAL ── */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    z-index: 200; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: #0e2640; border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--r); padding: 28px 32px; max-width: 520px; width: 92%;
    position: relative; max-height: 90vh; overflow-y: auto;
  }
  #modal-close {
    position: absolute; top: 14px; right: 16px;
    background: rgba(255,255,255,0.1); border: none; border-radius: 8px;
    color: white; font-size: 18px; cursor: pointer; padding: 2px 8px;
  }
  #modal-title { font-family: 'Fredoka One'; font-size: 22px; color: var(--gold); margin-bottom: 8px; }
  #modal-body { color: rgba(255,255,255,0.85); font-size: 14px; line-height: 1.6; }

  /* ── MINIGAME CANVASES ── */
  canvas { border-radius: 12px; display: block; margin: 0 auto; }
  .mg-controls { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .mg-btn {
    background: var(--teal); border: none; border-radius: 10px; padding: 9px 20px;
    font-family: 'Nunito'; font-weight: 800; font-size: 14px; color: white;
    cursor: pointer; transition: all .2s;
  }
  .mg-btn:hover { background: var(--teal2); transform: translateY(-2px); }
  .mg-btn.secondary { background: rgba(255,255,255,0.1); }
  .mg-score { text-align: center; font-size: 26px; font-family: 'Fredoka One'; color: var(--gold); margin: 10px 0; }
  .mg-msg { text-align: center; font-size: 14px; color: rgba(255,255,255,.75); margin-bottom: 6px; min-height: 20px; }

  /* ── SHOP VIEW ── */
  #shop-view { max-width: 820px; margin: 0 auto; }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .shop-item {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--r2); padding: 16px 10px; text-align: center;
    cursor: pointer; transition: all .2s;
  }
  .shop-item:hover { background: rgba(255,255,255,0.13); transform: translateY(-2px); }
  .shop-item.owned { border-color: var(--teal); background: rgba(0,184,169,0.1); }
  .shop-item .si-emoji { font-size: 34px; margin-bottom: 6px; }
  .shop-item .si-name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); margin-bottom: 4px; }
  .shop-item .si-price { font-size: 12px; color: var(--gold); font-weight: 700; }
  .shop-item.owned .si-price { color: var(--teal); }
  .section-title { font-family: 'Fredoka One'; font-size: 18px; color: var(--gold); margin-bottom: 14px; }

  /* ── TOASTS ── */
  #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: #0d2b45; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; padding: 12px 18px;
    color: white; font-size: 14px; font-weight: 700;
    animation: slideIn .3s ease, fadeOut .4s 2.6s forwards;
    max-width: 280px; display: flex; align-items: center; gap: 8px;
  }
  @keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; transform: translateX(60px); } }

  /* ── EXPAND BUTTON ── */
  .expand-btn {
    background: linear-gradient(135deg, var(--ocean), var(--ocean2));
    border: none; border-radius: 12px; padding: 10px 20px;
    font-family: 'Nunito'; font-weight: 800; font-size: 13px; color: white;
    cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px;
  }
  .expand-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(21,101,168,0.4); }
  .expand-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ── SNOW GROUND ── */
  .snow-ground {
    position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
    background: linear-gradient(to top, rgba(200,235,255,0.12), transparent);
    pointer-events: none; z-index: 0;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    #topbar { padding: 8px 12px; gap: 8px; }
    .stat-pill { padding: 3px 10px; font-size: 12px; }
    .tab-btn { padding: 6px 10px; font-size: 12px; }
    .view { padding: 12px; }
  }
</style>
</head>
<body>

<div id="stars"></div>
<div class="snow-ground"></div>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">🐧 Penguin Isle</div>
    <div class="stat-pill"><span>🐟</span> <span id="fish-count">0</span></div>
    <div class="stat-pill"><span>⭐</span> <span id="star-count">0</span></div>
    <div class="stat-pill"><span>🏘️</span> <span id="pop-count">0</span></div>
    <div class="spacer"></div>
    <div id="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('world')">🌍 World</button>
      <button class="tab-btn" onclick="switchTab('story')">📖 Story</button>
      <button class="tab-btn" onclick="switchTab('minigames')">🎮 Mini-games</button>
      <button class="tab-btn" onclick="switchTab('shop')">🛒 Shop</button>
    </div>
  </div>

  <!-- WORLD VIEW -->
  <div id="world-view" class="view active">
    <div id="toolbar">
      <div class="tool-label">Build</div>
      <div class="tool-section" id="toolbar-items"></div>
      <div class="tool-sep"></div>
      <div class="tool-label">Edit</div>
      <div class="tool-section">
        <button class="tool-btn erase-btn" id="erase-btn" onclick="selectTool('erase')" title="Erase">🗑️ <span>Erase</span></button>
      </div>
      <div class="tool-sep"></div>
      <button class="expand-btn" id="expand-btn" onclick="tryExpand()">🧊 Expand World</button>
    </div>
    <div id="world-container">
      <div id="world-grid"></div>
    </div>
  </div>

  <!-- STORY VIEW -->
  <div id="story-view" class="view">
    <div style="max-width:820px;margin:0 auto">
      <div style="margin-bottom:20px">
        <div style="font-family:'Fredoka One';font-size:26px;color:var(--gold);margin-bottom:6px">📖 The Chronicles of Penguin Isle</div>
        <div style="font-size:14px;color:rgba(255,255,255,.6)">Complete chapters to unlock new buildings, expand your world, and earn rewards!</div>
      </div>
      <div id="chapters-container"></div>
    </div>
  </div>

  <!-- MINIGAMES VIEW -->
  <div id="minigames-view" class="view">
    <div style="max-width:820px;margin:0 auto">
      <div style="margin-bottom:20px">
        <div style="font-family:'Fredoka One';font-size:26px;color:var(--gold);margin-bottom:6px">🎮 Mini-games</div>
        <div style="font-size:14px;color:rgba(255,255,255,.6)">Play to earn 🐟 Fish and ⭐ Stars to grow your island!</div>
      </div>
      <div class="minigame-grid" id="minigame-list"></div>
    </div>
  </div>

  <!-- SHOP VIEW -->
  <div id="shop-view" class="view">
    <div style="max-width:820px;margin:0 auto">
      <div style="margin-bottom:20px">
        <div style="font-family:'Fredoka One';font-size:26px;color:var(--gold);margin-bottom:6px">🛒 Shop</div>
        <div style="font-size:14px;color:rgba(255,255,255,.6)">Spend your 🐟 Fish to unlock new buildings and decorations!</div>
      </div>
      <div id="shop-content"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal-box">
    <button id="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-title"></div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toast-container"></div>

<script>
// ═══════════════════════════════════════════
//  GAME DATA
// ═══════════════════════════════════════════

const BUILDINGS = [
  { id:'penguin',   emoji:'🐧', name:'Penguin',     cost:0,    pop:1, cat:'penguins', unlocked:true  },
  { id:'igloo',     emoji:'🏠', name:'Igloo',       cost:20,   pop:3, cat:'homes',    unlocked:true  },
  { id:'fish',      emoji:'🐟', name:'Fish Pond',   cost:30,   pop:0, cat:'nature',   unlocked:true  },
  { id:'tree',      emoji:'🌲', name:'Pine Tree',   cost:15,   pop:0, cat:'nature',   unlocked:true  },
  { id:'snowman',   emoji:'⛄', name:'Snowman',     cost:25,   pop:0, cat:'deco',     unlocked:false },
  { id:'castle',    emoji:'🏰', name:'Ice Castle',  cost:120,  pop:10,cat:'homes',    unlocked:false },
  { id:'shop_b',    emoji:'🏪', name:'Fish Market', cost:80,   pop:0, cat:'business', unlocked:false },
  { id:'mountain',  emoji:'🏔️', name:'Mountain',    cost:60,   pop:0, cat:'nature',   unlocked:false },
  { id:'lighthouse',emoji:'🗼', name:'Lighthouse',  cost:100,  pop:2, cat:'deco',     unlocked:false },
  { id:'school',    emoji:'🏫', name:'Penguin School',cost:90, pop:5, cat:'business', unlocked:false },
  { id:'hospital',  emoji:'🏥', name:'Clinic',      cost:110,  pop:3, cat:'business', unlocked:false },
  { id:'park',      emoji:'🎠', name:'Snow Park',   cost:70,   pop:0, cat:'deco',     unlocked:false },
  { id:'cave',      emoji:'🗻', name:'Ice Cave',    cost:50,   pop:0, cat:'nature',   unlocked:false },
  { id:'crystals',  emoji:'💎', name:'Ice Crystals',cost:45,   pop:0, cat:'deco',     unlocked:false },
  { id:'boat',      emoji:'⛵', name:'Sailboat',    cost:85,   pop:1, cat:'deco',     unlocked:false },
  { id:'glacier',   emoji:'🧊', name:'Glacier',     cost:55,   pop:0, cat:'nature',   unlocked:false },
];

const CHAPTERS = [
  {
    id: 'ch1', title: 'A Penguin Arrives', icon: '🐧', unlocked: true,
    story: "It was a cold and blustery morning on the ice floe when the first penguin waddled ashore. With nothing but a dream and a fish, little Pebble planted her flippers in the snow and declared: \"This shall be our home!\" But building a civilization takes more than ambition...",
    tasks: [
      { id:'place_penguin', label:'Place your first Penguin', target:1, trackKey:'penguins_placed' },
      { id:'place_igloo',   label:'Build an Igloo',           target:1, trackKey:'igloos_placed'   },
      { id:'place_fish',    label:'Add a Fish Pond',          target:1, trackKey:'fish_placed'     },
    ],
    reward: { fish: 50, stars: 5, unlocks: ['snowman','cave'] },
    rewardText: '50 🐟 · 5 ⭐ · Unlocks Snowman & Ice Cave'
  },
  {
    id: 'ch2', title: 'Growing Pains', icon: '🏘️', unlocked: false,
    story: "Word spread through the southern ice shelf — Penguin Isle was real! Penguins began arriving by the dozen, waddling in from every direction with their little backpacks and big dreams. But Pebble realized the island needed proper infrastructure...",
    tasks: [
      { id:'pop_10',       label:'Reach a population of 10', target:10, trackKey:'population'    },
      { id:'igloos_3',     label:'Build 3 Igloos',           target:3,  trackKey:'igloos_placed' },
      { id:'snowman_1',    label:'Build a Snowman',          target:1,  trackKey:'snowman_placed'},
    ],
    reward: { fish: 100, stars: 10, unlocks: ['castle','shop_b','school'] },
    rewardText: '100 🐟 · 10 ⭐ · Unlocks Ice Castle, Fish Market & School'
  },
  {
    id: 'ch3', title: 'Commerce & Culture', icon: '🏪', unlocked: false,
    story: "The Fish Market opened on a Tuesday and changed everything. Suddenly penguins could trade their catches for goods, and a little economy bloomed on the ice. Elder Flippers declared it the greatest thing since the invention of the belly slide.",
    tasks: [
      { id:'market_1',    label:'Build a Fish Market',  target:1, trackKey:'shop_b_placed'    },
      { id:'school_1',    label:'Build a School',       target:1, trackKey:'school_placed'     },
      { id:'fish_3',      label:'Have 3 Fish Ponds',    target:3, trackKey:'fish_placed'       },
    ],
    reward: { fish: 150, stars: 15, unlocks: ['lighthouse','hospital','park'] },
    rewardText: '150 🐟 · 15 ⭐ · Unlocks Lighthouse, Clinic & Snow Park'
  },
  {
    id: 'ch4', title: 'The Great Blizzard', icon: '❄️', unlocked: false,
    story: "On the night of the winter solstice, a legendary blizzard descended upon Penguin Isle. The winds howled, the snow swirled, and even the bravest penguins huddled inside their igloos. But when the storm cleared, something magical glittered in the ice...",
    tasks: [
      { id:'crystals_2',  label:'Find 2 Ice Crystal deposits', target:2, trackKey:'crystals_placed' },
      { id:'lighthouse_1',label:'Build a Lighthouse',          target:1, trackKey:'lighthouse_placed'},
      { id:'pop_25',      label:'Reach a population of 25',    target:25, trackKey:'population'     },
    ],
    reward: { fish: 200, stars: 20, unlocks: ['mountain','glacier','boat'] },
    rewardText: '200 🐟 · 20 ⭐ · Unlocks Mountain, Glacier & Sailboat'
  },
  {
    id: 'ch5', title: 'Isle of Legends', icon: '🏰', unlocked: false,
    story: "Years passed. The little ice floe grew into a thriving island nation, known across all the southern oceans. Penguins came from as far as the equator (they were very lost) to marvel at the Ice Castle, the glowing lighthouse, and most importantly — the legendary Fish Market's daily specials.",
    tasks: [
      { id:'castle_1',    label:'Build the Ice Castle',   target:1, trackKey:'castle_placed'   },

    ],
    reward: { fish: 500, stars: 50, unlocks: [] },

  },
];

const MINIGAMES = [
  { id:'fishcatch',  name:'Fish Catch',      icon:'🎣', desc:'Tap fish as they swim by! The faster the better.', reward:'5–25 🐟' },
  { id:'iceslide',   name:'Ice Slide',       icon:'🛷', desc:'Guide your penguin down the mountain, dodge the rocks!', reward:'10–40 🐟' },

  { id:'memory',     name:'Ice Memory',      icon:'🧊', desc:'Match the pairs of arctic animals before time runs out.', reward:'15–50 🐟' },

];

// ═══════════════════════════════════════════
//  STATE & SAVE / LOAD
// ═══════════════════════════════════════════

const SAVE_KEY = 'penguin_isle_v2';

function defaultState() {
  return {
    fish: 50, stars: 0,
    gridW: 10, gridH: 8,
    cells: {},          // "col,row" -> buildingId
    tracking: {},       // trackKey -> count
    chapterClaimed: {}, // chapterId -> bool
    ownedBuildings: ['penguin','igloo','fish','tree'],
    selectedTool: 'penguin',
  };
}

let S = defaultState();

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { S = Object.assign(defaultState(), JSON.parse(raw)); }
  } catch(e) { S = defaultState(); }
}

function track(key, val=1) {
  S.tracking[key] = (S.tracking[key]||0) + val;
}
function getTrack(key) { return S.tracking[key]||0; }

// ═══════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════

function toast(msg, icon='🐧') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${icon}</span> ${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tab+'-view').classList.add('active');
  event.target.classList.add('active');
  if (tab === 'story')    renderStory();
  if (tab === 'shop')     renderShop();
  if (tab === 'minigames') renderMinigameList();
}

function updateStats() {
  let pop = 0;
  Object.values(S.cells).forEach(id => {
    const b = BUILDINGS.find(x=>x.id===id);
    if (b) pop += b.pop;
  });
  S.tracking['population'] = pop;
  document.getElementById('fish-count').textContent = S.fish;
  document.getElementById('star-count').textContent = S.stars;
  document.getElementById('pop-count').textContent = pop;
  document.getElementById('expand-btn').textContent = `🧊 Expand World (${expandCost()} 🐟)`;
  save();
}

function expandCost() { return Math.round(50 * Math.pow(1.4, ((S.gridW/5)+(S.gridH/4)-4))); }

// ═══════════════════════════════════════════
//  WORLD GRID
// ═══════════════════════════════════════════

function renderGrid() {
  const grid = document.getElementById('world-grid');
  grid.style.gridTemplateColumns = `repeat(${S.gridW}, 52px)`;
  grid.style.gridTemplateRows    = `repeat(${S.gridH}, 52px)`;
  grid.innerHTML = '';
  for (let r=0; r<S.gridH; r++) {
    for (let c=0; c<S.gridW; c++) {
      const key = `${c},${r}`;
      const div = document.createElement('div');
      div.className = 'cell';
      div.dataset.key = key;
      const placed = S.cells[key];
      if (placed) {
        const b = BUILDINGS.find(x=>x.id===placed);
        div.textContent = b ? b.emoji : '';
      }
      div.addEventListener('click', () => handleCellClick(key, div));
      grid.appendChild(div);
    }
  }
}

function handleCellClick(key, div) {
  if (S.selectedTool === 'erase') {
    if (S.cells[key]) {
      const id = S.cells[key];
      const tkey = id+'_placed';
      S.tracking[tkey] = Math.max(0,(S.tracking[tkey]||0)-1);
      delete S.cells[key];
      div.textContent = '';
      updateStats();
      checkStoryProgress();
    }
    return;
  }
  const tool = S.selectedTool;
  if (!tool) return;
  const b = BUILDINGS.find(x=>x.id===tool);
  if (!b) return;
  // Cost on first place? No — building is owned. Free placement from shop.
  if (!S.ownedBuildings.includes(b.id)) {
    toast(`Buy ${b.name} in the Shop first! (${b.cost} 🐟)`, '🛒');
    return;
  }
  if (S.cells[key]) {
    toast('That spot is taken! Erase first.', '⚠️');
    return;
  }
  S.cells[key] = tool;
  const tkey = tool+'_placed';
  track(tkey);
  div.textContent = b.emoji;
  // Special track for penguins
  if (tool==='penguin') track('penguins_placed',0); // already tracked above
  updateStats();
  checkStoryProgress();
}

function selectTool(id) {
  S.selectedTool = id;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  if (id==='erase') {
    document.getElementById('erase-btn').classList.add('active');
  } else {
    const btn = document.querySelector(`.tool-btn[data-id="${id}"]`);
    if (btn) btn.classList.add('active');
  }
  save();
}

function buildToolbar() {
  const container = document.getElementById('toolbar-items');
  container.innerHTML = '';
  BUILDINGS.filter(b => S.ownedBuildings.includes(b.id)).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'tool-btn' + (S.selectedTool===b.id?' active':'');
    btn.dataset.id = b.id;
    btn.innerHTML = `${b.emoji} <span>${b.name}</span>`;
    btn.title = b.name;
    btn.onclick = () => selectTool(b.id);
    container.appendChild(btn);
  });
}

function tryExpand() {
  const cost = expandCost();
  if (S.fish < cost) { toast(`Need ${cost} 🐟 to expand! Play mini-games to earn more.`, '🧊'); return; }
  S.fish -= cost;
  // Expand right or down alternately
  if (S.gridW <= S.gridH + 2) S.gridW = Math.min(20, S.gridW+2);
  else S.gridH = Math.min(16, S.gridH+2);
  toast(`World expanded! New size: ${S.gridW}×${S.gridH} 🧊`, '🌍');
  renderGrid();
  updateStats();
}

// ═══════════════════════════════════════════
//  STORY / CHAPTERS
// ═══════════════════════════════════════════

function checkStoryProgress() {
  // Unlock chapters based on previous completions
  CHAPTERS.forEach((ch, i) => {
    if (i === 0) return;
    const prev = CHAPTERS[i-1];
    if (isChapterComplete(prev)) ch.unlocked = true;
  });
  // Re-render if on story tab
  if (document.getElementById('story-view').classList.contains('active')) renderStory();
}

function isChapterComplete(ch) {
  return ch.tasks.every(t => {
    const val = t.trackKey === 'population' ? (S.tracking['population']||0) : (S.tracking[t.trackKey]||0);
    return val >= t.target;
  });
}

function renderStory() {
  const container = document.getElementById('chapters-container');
  container.innerHTML = '';

  // Sync chapter unlock from state
  CHAPTERS.forEach((ch, i) => {
    if (i === 0) ch.unlocked = true;
    else if (isChapterComplete(CHAPTERS[i-1])) ch.unlocked = true;
  });

  CHAPTERS.forEach(ch => {
    const complete = isChapterComplete(ch);
    const claimed = S.chapterClaimed[ch.id];

    const div = document.createElement('div');
    div.className = 'story-chapter' + (ch.unlocked?'':' locked');

    let tasksHTML = ch.tasks.map(t => {
      const val = Math.min(t.trackKey==='population'?(S.tracking['population']||0):(S.tracking[t.trackKey]||0), t.target);
      const pct = Math.round(val/t.target*100);
      const done = val >= t.target;
      return `<div class="task-row ${done?'done':''}">
        <span class="check">${done?'✅':'⬜'}</span>
        <span style="flex:1">${t.label}</span>
        <span style="font-size:12px;color:rgba(255,255,255,.5);margin-right:8px">${val}/${t.target}</span>
        <div class="task-progress" style="width:80px"><div class="task-progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');

    let actionHTML = claimed
      ? `<div class="claimed-badge">✅ Claimed!</div>`
      : `<button class="claim-btn" onclick="claimChapter('${ch.id}')" ${complete?'':'disabled'}>
          ${complete?'🎁 Claim Reward':'Complete tasks to claim'}
         </button>`;

    div.innerHTML = `
      <div class="chapter-header">
        <div class="chapter-icon">${ch.icon}</div>
        <div>
          <div class="chapter-title">${ch.unlocked?ch.title:'??? Locked ???'}</div>
          <div class="chapter-sub">Reward: ${ch.rewardText}</div>
        </div>
      </div>
      ${ch.unlocked ? `<div class="chapter-body">${ch.story}</div>` : '<div class="chapter-body">Complete the previous chapter to unlock this one!</div>'}
      ${ch.unlocked ? `<div class="chapter-tasks">${tasksHTML}</div>${actionHTML}` : ''}
    `;
    container.appendChild(div);
  });
}

function claimChapter(id) {
  const ch = CHAPTERS.find(c=>c.id===id);
  if (!ch || S.chapterClaimed[id] || !isChapterComplete(ch)) return;
  S.chapterClaimed[id] = true;
  S.fish  += ch.reward.fish;
  S.stars += ch.reward.stars;
  ch.reward.unlocks.forEach(uid => {
    if (!S.ownedBuildings.includes(uid)) S.ownedBuildings.push(uid);
    const b = BUILDINGS.find(x=>x.id===uid);
    if (b) b.unlocked = true;
  });
  toast(`Chapter "${ch.title}" complete! +${ch.reward.fish} 🐟 +${ch.reward.stars} ⭐`, '🎉');
  updateStats();
  buildToolbar();
  renderStory();
  checkStoryProgress();
}

function renderShop() {
  const el = document.getElementById('shop-content');
  const cats = [...new Set(BUILDINGS.map(b=>b.cat))];
  el.innerHTML = cats.map(cat => {
    const items = BUILDINGS.filter(b=>b.cat===cat);
    return `<div style="margin-bottom:24px">
      <div class="section-title">${catLabel(cat)}</div>
      <div class="shop-grid">
        ${items.map(b=>{
          const owned = S.ownedBuildings.includes(b.id);
          return `<div class="shop-item ${owned?'owned':''}" onclick="buyBuilding('${b.id}')">
            <div class="si-emoji">${b.emoji}</div>
            <div class="si-name">${b.name}</div>
            <div class="si-price">${owned?'✅ Owned':'🐟 '+b.cost}</div>
            ${b.pop?`<div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:3px">+${b.pop} 🐧 pop</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function catLabel(c) {
  return {penguins:'🐧 Penguins', homes:'🏠 Homes', nature:'🌲 Nature', deco:'✨ Decorations', business:'🏪 Businesses'}[c]||c;
}

function buyBuilding(id) {
  const b = BUILDINGS.find(x=>x.id===id);
  if (!b) return;
  if (S.ownedBuildings.includes(id)) { toast(`You already own ${b.name}!`, '✅'); return; }
  if (S.fish < b.cost) { toast(`Need ${b.cost} 🐟 for ${b.name}. Earn more in mini-games!`, '💸'); return; }
  S.fish -= b.cost;
  S.ownedBuildings.push(id);
  toast(`Unlocked ${b.emoji} ${b.name}!`, '🛒');
  updateStats();
  buildToolbar();
  renderShop();
}

function renderMinigameList() {
  const el = document.getElementById('minigame-list');
  el.innerHTML = MINIGAMES.map(mg => `
    <div class="minigame-card" onclick="openMinigame('${mg.id}')">
      <div class="mg-icon">${mg.icon}</div>
      <div class="mg-name">${mg.name}</div>
      <div class="mg-desc">${mg.desc}</div>
      <div class="mg-reward">${mg.reward}</div>
    </div>
  `).join('');
}

function openMinigame(id) {
  const mg = MINIGAMES.find(m=>m.id===id);
  if (!mg) return;
  document.getElementById('modal-title').textContent = mg.icon+' '+mg.name;
  document.getElementById('modal-body').innerHTML = '<div id="mg-container"></div>';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => {
    const c = document.getElementById('mg-container');
    if (id==='fishcatch') buildFishCatch(c);
    else if (id==='iceslide') buildIceSlide(c);
    else if (id==='snowballs') buildSnowballs(c);
    else if (id==='memory') buildMemory(c);

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay') && e.target !== document.getElementById('modal-close') && !e.target.classList.contains('mg-btn')) return;
  if (e && e.target === document.getElementById('modal-box')) return;
  if (!e || e.target === document.getElementById('modal-overlay') || e.target.id==='modal-close') {
    stopAllGames();
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-body').innerHTML = '';
  }
}

let gameLoops = [];
function stopAllGames() { gameLoops.forEach(id=>clearInterval(id)); gameLoops=[]; }

function giveReward(fish, msg) {
  S.fish += fish;
  toast(`+${fish} 🐟 earned! ${msg}`, '🎣');
  updateStats();
}

//  MINI-GAME 1: FISH CATCH
// ═══════════════════════════════════════════

function buildFishCatch(container) {
  container.innerHTML = `
    <div class="mg-msg" id="fc-msg">Tap the fish before they swim away!</div>
    <div class="mg-score" id="fc-score">🐟 0</div>
    <canvas id="fc-canvas" width="420" height="300" style="background:#0d2b4a;border-radius:12px;cursor:crosshair"></canvas>
    <div class="mg-controls">
      <button class="mg-btn" id="fc-start" onclick="startFishCatch()">▶ Start</button>
      <button class="mg-btn secondary" onclick="closeModal({target:document.getElementById('modal-overlay')})">✕ Close</button>
    </div>`;
}

function startFishCatch() {
  stopAllGames();
  const canvas = document.getElementById('fc-canvas');
  const ctx = canvas.getContext('2d');
  let score=0, timeLeft=20, fish=[];
  document.getElementById('fc-score').textContent='🐟 0';
  document.getElementById('fc-msg').textContent='Tap the fish!';
  document.getElementById('fc-start').disabled=true;

  function spawnFish() {
    fish.push({x:-30, y:20+Math.random()*260, vx:1.5+Math.random()*2.5, size:18+Math.random()*14, emoji:'🐟'});
  }

  function draw() {
    ctx.clearRect(0,0,420,300);
    // Water ripples
    ctx.fillStyle='rgba(30,80,140,0.3)';
    for(let i=0;i<5;i++){ctx.fillRect(0,60*i,420,30);}
    // Fish
    fish.forEach(f=>{
      ctx.font=`${f.size*2}px serif`;
      ctx.fillText(f.emoji,f.x,f.y);
    });
    // Timer bar
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(10,280,400,8);ctx.borderRadius=4;
    ctx.fillStyle='#00b8a9';ctx.fillRect(10,280,400*(timeLeft/20),8);
  }

  canvas.onclick = function(e) {
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(420/r.width), my=(e.clientY-r.top)*(300/r.height);
    fish = fish.filter(f=>{
      const hit = mx>f.x-5 && mx<f.x+f.size*2+10 && my>f.y-f.size*2 && my<f.y+10;
      if(hit){score++;document.getElementById('fc-score').textContent='🐟 '+score;}
      return !hit;
    });
  };

  const spawn = setInterval(spawnFish,800); gameLoops.push(spawn);
  const loop = setInterval(()=>{
    fish.forEach(f=>f.x+=f.vx);
    fish=fish.filter(f=>f.x<450);
    draw();
  },33); gameLoops.push(loop);

  const timer = setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      clearInterval(timer); clearInterval(loop); clearInterval(spawn);
      gameLoops=[];
      const reward=score*2+5;
      document.getElementById('fc-msg').textContent=`Game over! You caught ${score} fish!`;
      document.getElementById('fc-start').textContent='▶ Play Again';
      document.getElementById('fc-start').disabled=false;
      document.getElementById('fc-start').onclick=startFishCatch;
      giveReward(reward,`Fish Catch: ${score} fish!`);
    }
  },1000); gameLoops.push(timer);
}

// ═══════════════════════════════════════════
//  MINI-GAME 2: ICE SLIDE
// ═══════════════════════════════════════════

function buildIceSlide(container) {
  container.innerHTML = `
    <div class="mg-msg" id="is-msg">Press ← → or A/D to dodge the rocks!</div>
    <div class="mg-score" id="is-score">🛷 0m</div>
    <canvas id="is-canvas" width="320" height="380" style="background:#1a3d6b;border-radius:12px"></canvas>
    <div class="mg-controls">
      <button class="mg-btn" id="is-left" ontouchstart="isKeys.left=true" ontouchend="isKeys.left=false">◀</button>
      <button class="mg-btn" id="is-start" onclick="startIceSlide()">▶ Start</button>
      <button class="mg-btn" id="is-right" ontouchstart="isKeys.right=true" ontouchend="isKeys.right=false">▶</button>
      <button class="mg-btn secondary" onclick="closeModal({target:document.getElementById('modal-overlay')})">✕ Close</button>
    </div>`;
}

const isKeys={left:false,right:false};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')isKeys.left=true;if(e.key==='ArrowRight'||e.key==='d')isKeys.right=true;});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')isKeys.left=false;if(e.key==='ArrowRight'||e.key==='d')isKeys.right=false;});

function startIceSlide() {
  stopAllGames();
  const canvas=document.getElementById('is-canvas');
  const ctx=canvas.getContext('2d');
  let px=150,py=320,dist=0,speed=2,rocks=[],alive=true;
  document.getElementById('is-start').disabled=true;
  document.getElementById('is-score').textContent='🛷 0m';
  document.getElementById('is-msg').textContent='Dodge the rocks!';

  function spawnRock(){rocks.push({x:20+Math.random()*280,y:-30,r:12+Math.random()*10});}
  const sp=setInterval(spawnRock,900);gameLoops.push(sp);

  const loop=setInterval(()=>{
    if(!alive)return;
    if(isKeys.left&&px>20)px-=4;
    if(isKeys.right&&px<300)px+=4;
    rocks.forEach(r=>r.y+=speed);
    rocks=rocks.filter(r=>r.y<400);
    dist+=speed*0.05; speed=2+dist*0.05;
    // Collision
    rocks.forEach(r=>{
      if(Math.hypot(px-r.x,py-r.y)<r.r+14){alive=false;}
    });
    // Draw
    ctx.clearRect(0,0,320,380);
    // Snow stripes
    ctx.fillStyle='rgba(180,220,255,0.06)';
    for(let i=0;i<8;i++){ctx.fillRect(i*40,0,20,380);}
    // Rocks
    rocks.forEach(r=>{ctx.fillStyle='#445';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();});
    // Penguin
    ctx.font='28px serif';ctx.fillText('🐧',px-14,py+10);
    document.getElementById('is-score').textContent='🛷 '+Math.floor(dist)+'m';
    if(!alive){
      clearInterval(loop);clearInterval(sp);gameLoops=[];
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,140,320,80);
      ctx.fillStyle='white';ctx.font='bold 20px Nunito';ctx.textAlign='center';
      ctx.fillText(`Crashed at ${Math.floor(dist)}m!`,160,180);ctx.textAlign='start';
      document.getElementById('is-msg').textContent='Game over!';
      document.getElementById('is-start').textContent='▶ Try Again';
      document.getElementById('is-start').disabled=false;
      document.getElementById('is-start').onclick=startIceSlide;
      giveReward(Math.min(40,Math.floor(dist)+8),`Ice Slide: ${Math.floor(dist)}m!`);
    }
  },33);gameLoops.push(loop);
}

function buildSnowballs(container) {
  container.innerHTML = `
    <div class="mg-msg" id="sb-msg">Click the targets to hit them with snowballs!</div>
    <div class="mg-score" id="sb-score">🎯 0</div>
    <canvas id="sb-canvas" width="420" height="280" style="background:#12304f;border-radius:12px;cursor:crosshair"></canvas>
    <div class="mg-controls">
      <button class="mg-btn" id="sb-start" onclick="startSnowballs()">▶ Start</button>
      <button class="mg-btn secondary" onclick="closeModal({target:document.getElementById('modal-overlay')})">✕ Close</button>
    </div>`;
}

function startSnowballs() {
  stopAllGames();
  const canvas=document.getElementById('sb-canvas');
  const ctx=canvas.getContext('2d');
  let score=0,timeLeft=15,targets=[],particles=[];
  document.getElementById('sb-score').textContent='🎯 0';
  document.getElementById('sb-start').disabled=true;
  document.getElementById('sb-msg').textContent='Hit the targets!';

  function spawnTarget(){
    if(targets.length<5) targets.push({x:30+Math.random()*360,y:30+Math.random()*220,r:18+Math.random()*12,life:3000,born:Date.now()});
  }
  const sp=setInterval(spawnTarget,600);gameLoops.push(sp);

  function draw(){
    ctx.clearRect(0,0,420,280);
    // Snowflakes
    ctx.fillStyle='rgba(255,255,255,0.07)';
    for(let i=0;i<30;i++){ctx.fillRect((i*37+Date.now()*0.02)%420,(i*19+Date.now()*0.04)%280,2,2);}
    // Targets
    targets.forEach(t=>{
      const age=(Date.now()-t.born)/t.life;
      ctx.globalAlpha=1-age*0.6;
      ctx.fillStyle='#ff7f7f';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='white';ctx.font='bold 14px Nunito';ctx.textAlign='center';
      ctx.fillText('❄️',t.x,t.y+5);ctx.textAlign='start';
      ctx.globalAlpha=1;
    });
    // Particles
    particles.forEach(p=>{
      ctx.globalAlpha=p.life/20;
      ctx.fillStyle='white';ctx.fillRect(p.x,p.y,3,3);
      p.x+=p.vx;p.y+=p.vy;p.life--;
    });
    particles=particles.filter(p=>p.life>0);
    ctx.globalAlpha=1;
    ctx.fillStyle='#00b8a9';ctx.fillRect(10,268,400*(timeLeft/15),8);
    targets=targets.filter(t=>(Date.now()-t.born)<t.life);
  }

  canvas.onclick=function(e){
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(420/r.width),my=(e.clientY-r.top)*(280/r.height);
    let hit=false;
    targets=targets.filter(t=>{
      if(!hit&&Math.hypot(mx-t.x,my-t.y)<t.r+5){
        hit=true;score++;
        document.getElementById('sb-score').textContent='🎯 '+score;
        for(let i=0;i<12;i++)particles.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:20});
        return false;
      }
      return true;
    });
  };

  const loop=setInterval(draw,33);gameLoops.push(loop);
  const timer=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){
      clearInterval(timer);clearInterval(loop);clearInterval(sp);gameLoops=[];
      document.getElementById('sb-msg').textContent=`Done! You hit ${score} targets!`;
      document.getElementById('sb-start').textContent='▶ Play Again';
      document.getElementById('sb-start').disabled=false;
      document.getElementById('sb-start').onclick=startSnowballs;
      giveReward(score*3+5,`Snowball Toss: ${score} hits!`);
    }
  },1000);gameLoops.push(timer);
}

// ═══════════════════════════════════════════
//  MINI-GAME 4: MEMORY MATCH
// ═══════════════════════════════════════════

function buildMemory(container) {
  const emojis=['🐧','🐟','🧊','🌊','⭐','🏔️','🦭','❄️'];
  let cards=[];
  [...emojis,...emojis].forEach((e,i)=>cards.push({id:i,emoji:e,flipped:false,matched:false}));
  cards=cards.sort(()=>Math.random()-0.5);
  let flipped=[],moves=0,matches=0,canClick=true;

  container.innerHTML=`
    <div class="mg-msg" id="mem-msg">Match all the pairs!</div>
    <div class="mg-score" id="mem-score">🎯 0 moves</div>
    <div id="mem-grid" style="display:grid;grid-template-columns:repeat(4,72px);gap:8px;justify-content:center;margin:12px auto"></div>
    <div class="mg-controls">
      <button class="mg-btn secondary" onclick="buildMemory(document.getElementById('mg-container'))">🔄 Restart</button>
      <button class="mg-btn secondary" onclick="closeModal({target:document.getElementById('modal-overlay')})">✕ Close</button>
    </div>`;

  function render(){
    const g=document.getElementById('mem-grid');
    if(!g)return;
    g.innerHTML='';
    cards.forEach((c,i)=>{
      const el=document.createElement('div');
      el.style.cssText=`width:72px;height:72px;background:${c.flipped||c.matched?'rgba(0,184,169,0.3)':'rgba(255,255,255,0.1)'};
        border:2px solid ${c.matched?'var(--teal)':'rgba(255,255,255,0.2)'};border-radius:12px;
        display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;transition:all .2s`;
      el.textContent=c.flipped||c.matched?c.emoji:'❓';
      el.onclick=()=>{
        if(!canClick||c.flipped||c.matched)return;
        c.flipped=true;flipped.push(i);moves++;
        document.getElementById('mem-score').textContent='🎯 '+moves+' moves';
        render();
        if(flipped.length===2){
          canClick=false;
          const [a,b]=flipped;
          setTimeout(()=>{
            if(cards[a].emoji===cards[b].emoji){cards[a].matched=cards[b].matched=true;matches++;} 
            else{cards[a].flipped=cards[b].flipped=false;}
            flipped=[];canClick=true;render();
            if(matches===8){
              document.getElementById('mem-msg').textContent=`You won in ${moves} moves! 🎉`;
              const reward=Math.max(15,50-moves*2);
              giveReward(reward,`Memory: ${moves} moves!`);
            }
          },700);
        }
      };
      g.appendChild(el);
    });
  }
  render();
}

// ═══════════════════════════════════════════
//  MINI-GAME 5: TRIVIA
// ═══════════════════════════════════════════

const TRIVIA_Q = [
  {q:'How many species of penguin are there?',a:'18',opts:['12','18','24','6']},
  {q:'Which is the tallest penguin species?',a:'Emperor',opts:['King','Emperor','Gentoo','Macaroni']},
  {q:'What do penguins use to swim?',a:'Flippers',opts:['Fins','Flippers','Tails','Feet']},
  {q:'Penguins live in which hemisphere?',a:'Southern',opts:['Northern','Southern','Both','Neither']},
  {q:'What is a baby penguin called?',a:'Chick',opts:['Pup','Chick','Cub','Kit']},
  {q:'Which penguin has a yellow crest?',a:'Macaroni',opts:['Rockhopper','Macaroni','Chinstrap','Adélie']},
  {q:'Can penguins fly?',a:'No',opts:['Yes','No','Only at night','Only when young']},
  {q:'What do penguins eat mostly?',a:'Fish',opts:['Seaweed','Shrimp','Fish','Squid only']},
  {q:'Where do Emperor penguins breed?',a:'Antarctica',opts:['Argentina','New Zealand','Antarctica','South Africa']},
  {q:'What color are most penguins?',a:'Black and white',opts:['Blue and white','Brown','Black and white','Grey']},
];

function buildTrivia(container) {
  let qs=[...TRIVIA_Q].sort(()=>Math.random()-0.5).slice(0,5);
  let current=0,score=0;

  function render(){
    if(current>=qs.length){
      const reward=score*4+5;
      container.innerHTML=`
        <div class="mg-msg" style="font-size:16px">Quiz complete!</div>
        <div class="mg-score">${score}/${qs.length} correct 🎉</div>
        <div class="mg-controls">
          <button class="mg-btn" onclick="buildTrivia(document.getElementById('mg-container'))">🔄 Play Again</button>
          <button class="mg-btn secondary" onclick="closeModal({target:document.getElementById('modal-overlay')})">✕ Close</button>
        </div>`;
      giveReward(reward,`Trivia: ${score}/${qs.length}!`);
      return;
    }
    const q=qs[current];
    const shuffled=[...q.opts].sort(()=>Math.random()-0.5);
    container.innerHTML=`
      <div class="mg-msg">Question ${current+1} of ${qs.length}</div>
      <div class="mg-score" style="font-size:16px;margin-bottom:14px">${q.q}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        ${shuffled.map(o=>`
          <button class="mg-btn" style="font-size:13px;padding:12px" onclick="answerTrivia('${o.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}')">
            ${o}
          </button>`).join('')}
      </div>
      <div class="mg-msg" id="trivia-result"></div>
      <div class="mg-controls">
        <button class="mg-btn secondary" onclick="closeModal({target:document.getElementById('modal-overlay')})">✕ Close</button>
      </div>`;
  }

  window.answerTrivia=function(ans,correct){
    const r=document.getElementById('trivia-result');
    if(ans===correct){score++;r.textContent='✅ Correct!';r.style.color='#00b8a9';}
    else{r.textContent=`❌ Nope! It was: ${correct}`;r.style.color='#ff7f7f';}
    document.querySelectorAll('#mg-container .mg-btn').forEach(b=>b.disabled=true);
    setTimeout(()=>{current++;render();},1200);
  };
  render();
}

// ═══════════════════════════════════════════
//  STARS BACKGROUND
// ═══════════════════════════════════════════

function buildStars(){
  const s=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const d=document.createElement('div');
    d.className='star';
    d.style.cssText=`width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    s.appendChild(d);
  }
}

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════

function boot() {
  buildStars();
  load();
  // Sync owned buildings back to BUILDINGS array
  BUILDINGS.forEach(b=>{ if(S.ownedBuildings.includes(b.id)) b.unlocked=true; });
  // Sync chapter unlocks
  CHAPTERS.forEach((ch,i)=>{
    if(i===0)ch.unlocked=true;
    else if(isChapterComplete(CHAPTERS[i-1]))ch.unlocked=true;
  });
  buildToolbar();
  renderGrid();
  updateStats();
}

boot();
